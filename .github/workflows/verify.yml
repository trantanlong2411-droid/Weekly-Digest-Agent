name: Weekly Digest Agent — tests, Worker bundle and live Pharos Chain MCP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Test honest sampled metrics and durable delivery
        run: npm test
      - name: Bundle Worker
        run: npm run build
  chain-mcp-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Sample two real time windows through Pharos Chain MCP
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-digest-live-chain-mcp
          path: proof/live-chain-smoke.json
          retention-days: 30
          if-no-files-found: warn
